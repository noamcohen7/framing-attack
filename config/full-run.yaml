# =============================================================================
# Phase 1 full run (PAID tiers: Groq Developer + Gemini billing enabled).
# Same models and caps as three-model.yaml, paced for paid rate limits.
#
#   1. Baselines on 350 questions (50 custom + 300 TriviaQA), ~21k calls, ~$1:
#      python scripts/run_baselines.py --config config/full-run.yaml --workers 8
#   2. Attack the ones the model knows (native accuracy >= 4/5), ~$15-20:
#      python scripts/run_attack.py --config config/full-run.yaml --workers 8
#      (after an interruption or cap stop: add --resume)
#
# Spend: max_usd_total caps ALL runs together via results/spend_ledger.json.
# =============================================================================
dataset:
  name: "combined"                # custom facts first, then TriviaQA
  max_samples: 350

target_model:
  provider: "groq"
  model_name: "openai/gpt-oss-20b"
  temperature: 0.0
  max_tokens: 512
  reasoning_effort: "low"
  num_samples: 5
  requests_per_minute: 900        # Groq Developer: 1K RPM / 250K TPM per model
  concurrency: 5                  # the 5 samples of one rephrasing in parallel

auxiliary_model:
  provider: "groq"
  model_name: "openai/gpt-oss-120b"
  temperature: 0.9
  max_tokens: 1024
  reasoning_effort: "low"
  requests_per_minute: 700        # extraction ~225 tok/call: 700 RPM ~ 160K TPM, under 250K
  concurrency: 1

equivalence:
  nli_model: null                 # judge-only (no local model)
  llm_judge:
    provider: "gemini"
    model_name: "gemini-3.5-flash-lite"
    temperature: 0.0
    requests_per_minute: 500      # paid tier; 429s wait for retry-after
  require_both: false

budget:
  max_requests: 450000      # per run; full run is ~400k calls worst case
  max_usd: 30.0             # per run (estimated from token counts)
  max_usd_total: 30.0       # across ALL runs: results/spend_ledger.json
  prices:
    openai/gpt-oss-20b:      {input_per_m: 0.075, output_per_m: 0.30}
    openai/gpt-oss-120b:     {input_per_m: 0.15, output_per_m: 0.60}
    gemini-3.5-flash-lite:   {input_per_m: 0.30, output_per_m: 2.50}
