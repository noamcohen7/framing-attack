# three-model.yaml + smoke.yaml search budget, for quick live checks.
# Copy of three-model.yaml (--config takes one override file) with the small
# search from smoke.yaml. Keep the two in sync when changing models.
target_model:
  provider: "groq"
  model_name: "openai/gpt-oss-20b"
  temperature: 0.0
  max_tokens: 512
  reasoning_effort: "low"
  num_samples: 3
  requests_per_minute: 28
  concurrency: 1

auxiliary_model:
  provider: "groq"
  model_name: "openai/gpt-oss-120b"
  temperature: 0.9
  max_tokens: 1024
  reasoning_effort: "low"
  requests_per_minute: 28
  concurrency: 1

equivalence:
  nli_model: null                 # judge-only (no local model)
  llm_judge:
    provider: "gemini"
    model_name: "gemini-3.5-flash-lite"
    temperature: 0.0
    requests_per_minute: 15
  require_both: false

budget:
  max_requests: 450000      # per run; full run is ~400k calls worst case
  max_usd: 30.0             # per run (estimated from token counts)
  max_usd_total: 30.0       # across ALL runs: results/spend_ledger.json
  prices:
    openai/gpt-oss-20b:      {input_per_m: 0.075, output_per_m: 0.30}
    openai/gpt-oss-120b:     {input_per_m: 0.15, output_per_m: 0.60}
    gemini-3.5-flash-lite:   {input_per_m: 0.30, output_per_m: 2.50}

evolution:
  population_size: 4
  num_generations: 3
  elite_count: 1

baselines:
  num_naive_paraphrases: 2
  num_samples_per_paraphrase: 3
